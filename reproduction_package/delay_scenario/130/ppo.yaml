###########################
#   Experiment Settings   #
###########################

snapshot:
  # Snapshot settings:
  # - enabled: whether to save a snapshot of the full config for replicating scenario
  enabled: false

###########################
#   World Configuration   #
###########################

world:
  grid_world_conf:
    # - number of rows and columns
    # - single_chain_mode: if true only one of each orb will be created and spawned at once, if collected in order episode terminates with a reward, else just truncation
    # - delay_mode: if enabled, consuming an orb triggers a cooldown period during which no additional orb consumption can occur
    # - delay: the delay used in delay mode
    # - max_tier_scoring (used in tier_orb_conf, must be active in single_chain_mode): if true, reward is only given if max tier is reached
    # - termination_on_max_tier: terminate the episode as max tier is reached
    # - curriculum_training: when enabled, certain scenario parameters are adjusted to better support progressive learning across increasing difficulty levels
    # - de_spawn_tiers: decides if tiers should de-spawn just as the non tier orbs
    # - max_tier: this is the highest tier that orbs can reach in this environment
    # - max active orbs: number of max active orbs on grid
    grid_rows: &grid_rows 5
    grid_cols: &grid_cols 5
    single_chain_mode: &single_chain_mode true
    delay_mode: true
    delay: 130
    max_tier_scoring: &max_tier_scoring true
    termination_on_max_tier: &termination_on_max_tier true
    curriculum_training: &curriculum_training false
    de_spawn_tiers: &de_spawn_tiers false
    max_tier: &max_tier 3
    max_active_orbs: &max_active_orbs 3

  renderer_conf:
    # - grid_rows / grid_cols (set in grid_world_conf): used to calculate display size and layout
    # - img_assets: paths to graphic elements
    grid_rows: *grid_rows
    grid_cols: *grid_cols
    img_assets:
      droid_img: "assets/sprites/droid.png"
      positive_orb_img: "assets/sprites/positive_orb.png"
      negative_orb_img: "assets/sprites/negative_orb.png"
      floor_img: "assets/tiles/floor.png"
      hud_img: "assets/sprites/hud.png"

  droid_conf:
    # - grid_rows / grid_cols (set in grid_world_conf): defines the grid the droid can move in
    # - starting_score: initial score of the droid
    # - step_penalty: the cost of moving around for the agent
    # - boundary_penalty: the cost of hugging walls
    # - chain_break_penalty (passed to digestion engine): the cost of consuming orbs in wrong order
    # - tier_consumption_penalty (passed to digestion engine): (only applicable if step_wise_scoring is true) punishment for consuming tier orbs in the wrong order
    # - reward_multiplier (passed to digestion engine): multiplier applied to rewards when threshold scoring in tier_orb_conf is activated, a sensible default is 1.0, then experiment if reward magnitudes get's to large for higher max tiers
    grid_rows: *grid_rows
    grid_cols: *grid_cols
    starting_score: 50
    step_penalty: &step_penalty 0.0
    boundary_penalty: -1.0
    chain_break_penalty: -1.0
    tier_consumption_penalty: *step_penalty
    reward_multiplier: 1.0

  orb_factory_conf:
    # - grid_rows / grid_cols (set in grid_world_conf): used to set orbs life span
    # - max_active_orbs (set in grid_world_conf): max active orbs on grid
    # - max_tier (set in grid_world_conf): this is the highest tier that orbs can reach in this environment
    # - single_chain_mode (set in grid_world_conf): if true only one of each orb will be created and spawned at once, if collected in order episode terminates with a reward, else just termination
    # - each orb type can be enabled/disabled
    # - weight defines relative spawn frequency when multiple orbs are active
    grid_rows: *grid_rows
    grid_cols: *grid_cols
    max_active_orbs: *max_active_orbs
    max_tier: *max_tier
    single_chain_mode: *single_chain_mode
    types:
      negative:
        enabled: &neg_enabled false
        weight: 1
      tier:
        enabled: &tier_enabled true
        weight: 2

  negative_orb_conf:
    # - reward: penalty applied when interacting with the orb
    # - cool_down: number of steps before the orb can be reused
    reward: -3.0
    cool_down: 5

  tier_orb_conf:
    # - linear_reward_growth: if true, reward scales linearly instead of exponentially
    # - step_wise_scoring: if true, reward is given per correctly consumed tier instead of on chain break
    # - threshold_scoring: if true, partial reward is given if the chain breaks or an accumulated reward if max tier is reached
    # - max_tier_scoring (set in grid_world_conf): if true, reward is only given if max tier is reached
    # - growth_factor: multiplier applied per tier increase if linear_reward_growth is false
    # - base_reward: starting reward value at tier 0
    # - cool_down: number of steps before the orb can be reused
    linear_reward_growth: false
    step_wise_scoring: false
    threshold_scoring: false
    max_tier_scoring: *max_tier_scoring
    growth_factor: 1.5
    base_reward: 2.0
    cool_down: 7

###########################
#    Obs Configuration    #
###########################

obs:
  observation_handler:
    # - perception: decides type and how much information to pack into the agents observation. Hard, medium and easy are the options
    # - max_steps: number of steps in an episode until truncated
    perception: "vector_markovian"
    max_steps: &max_steps 300

  perception:
    # - max_score: set per scenario based on expected achievable score in this setup
    # - max_steps (set in observation_handler): number of steps in an episode until truncated
    # - max_tier (set in orb_factory_conf): max tier of the tier type orbs
    # - grid_rows / grid_cols (set in grid_world_conf): fix the maximum observation space size for those variables
    # - max_active_orbs (set in grid_world_conf): max active orbs on grid
    # - include_timer(set in grid_world_conf): used to decide if orb timer should be added to the observation
    # - single_chain_mode (set in grid_world_conf): if true only one of each orb will be created and spawned at once
    # - curriculum_training (set in grid_world_conf): when enabled, certain scenario parameters are adjusted to better support progressive learning across increasing difficulty levels
    # - tiers: (only applicable when curriculum training is enabled) number of orbs in the observation
    max_score: &max_score 100
    max_steps: *max_steps
    max_tier: *max_tier
    grid_rows: *grid_rows
    grid_cols: *grid_cols
    max_active_orbs: *max_active_orbs
    include_timer: *de_spawn_tiers
    single_chain_mode: *single_chain_mode
    curriculum_training: *curriculum_training
    tiers: 5
    enabled_orbs:
      neg_enabled: *neg_enabled
      tier_enabled: *tier_enabled

###########################
#   Agent Configuration   #
###########################

agent:
  global_agent_conf:
    # - algorithm: which algorithm the agent will use
    # - agent_steps: identifier for the model to continue training or evaluate
    # - id_tag: (null if not applicable) used to tag your model so it can be easily found
    # - save_folder: (null for default) specify this if you want to have special folders for your experiments
    # - seed: algorithm seed for initial weights and env reproducibility
    # - human_control: allow human to control the game manually, disables training and eval
    # - training: set to false to evaluate the agent
    # - check_env: set to true if you wanna control your changes in the environment didn't break anything obvious
    # - plateau_detection: true if you are using automatic training termination
    # - plateau_threshold: (only applicable if plateau_detection is enabled) amount of steps allowed before terminating the stale training
    # - terminate_threshold: (only applicable if plateau_detection is enabled) amount of steps allowed before terminating the plateaued training
    alg: "PPO"
    agent_steps: "16001024"
    id_tag: 'delay_130'
    save_folder: 'reproduction_package/delay_mode/ppo'
    seed: 3
    human_control: false
    training: true
    check_env: false
    plateau_detection: false
    plateau_threshold: 15000000
    terminate_threshold: 3000000

  train_agent_conf:
    # - continue_training: continue from a previously saved model
    # - csv_output: False if you are debugging or experimenting and only want to inspect behavior, not persist results
    # - tensor_output: False if you are debugging or experimenting and only want to inspect behavior, not persist training data
    # - model_output : False if you are debugging or experimenting and only want to inspect behavior, not persist checkpoints
    # - n_envs: parallel training environments, more = faster training, benchmark to find your hardware's sweet spot
    # - timesteps: number of timesteps per iteration (a checkpoint is saved after this many steps)
    # - iterations: total number of training iterations
    # - render_mode (null, "human" or "rgb_array"): null is default, change to human if you want visual feedback for debugging or "rgb_array" if you want to record at certain intervals
    # - rec_interval: only applicable if render mode is set to "rgb_array", decides at what step intervals to start record the training
    # - rec_length: only applicable if render mode is set to "rgb_array", decides how many steps the recording should be
    continue_training: false
    csv_output: true
    tensorboard_output: true
    model_output: true
    n_envs: 16
    timesteps: 10760192
    iterations: 1
    render_mode: null
    rec_interval: 10000
    rec_length: 100

  eval_agent_conf:
    # - num_eval_episodes: how many episodes to evaluate
    # - render_mode (null, "human" or "rgb_array"): set to null if you don't want visual feedback during evaluation and "rgb_array" if you want to record runs
    # - rec_episode: only applicable if render mode is set to "rgb_array", decides which episode to record
    # - csv_output: if you want to use the custom logger to persist results from the runs.
    num_eval_episodes: 300
    render_mode: 'human'
    rec_episode: 100
    csv_output: false