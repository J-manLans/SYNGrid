# Base config: goal_single_tier_chain_spatial
#
# Spatial as it was run: tier 3, seen through the window around the droid, with the
# penalties and orb rewards the ablations kept. A run's YAML chooses the grid, max_steps,
# the negative orb's switch and the perception, and they are merged onto this. Nothing
# else here is set by a run.
world_conf:
  max_steps: 100

  grid_conf:
    grid_rows: 5
    grid_cols: 5

  droid_conf:
    max_energy: 50 # what the droid starts with and the most it can hold; the episode ends at 0
    step_penalty: -0.001
    boundary_penalty: -1.0

  goal_conf:
    timeout_penalty: -1.0

  tier_orb_conf:
    max_tier: 3
    base_reward: 1.0 # a tier is worth base_reward * tier ** growth_factor
    growth_factor: 1.5 # with these two, the three tiers together are worth about 9.0
    chain_break_penalty: -0.01

  neg_orb_conf:
    enabled: false
    reward: -3.0
    cool_down: 10

obs_conf:
  observation_handler_conf:
    perception: vector_fog_of_war
