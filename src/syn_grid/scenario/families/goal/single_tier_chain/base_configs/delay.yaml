# Base config: goal_single_tier_chain_delay
#
# Delay: tier 3 on 5x5, the whole grid in view. Eating a tier orb freezes the other tier orbs
# for delay_conf.steps steps. The negative orb is not frozen. Its tunables are the delay, the
# negative orb's switch and the perception, merged onto this. Nothing else here is set by a run.
#
# There is no max_steps: TierDelayScenarioConf sets it from the delay and the grid, as
# (max_tier - 1) * delay + 5 * (grid_rows + grid_cols), so 50 spare steps on 5x5 at any delay.
#
# The thesis delay runs had delays of 30, 70, 130, 260 and 390 with max_steps of 150, 200, 300,
# 550 and 850, so their spare steps were 90, 60, 40, 30 and 70. The step penalty is 0, so
# waiting out a silence is free.

world_conf:
  grid_conf:
    grid_rows: 5
    grid_cols: 5

  droid_conf:
    max_energy: 50 # what the droid starts with and the most it can hold; the episode ends at 0
    step_penalty: 0.0
    boundary_penalty: -1.0

  goal_conf:
    timeout_penalty: -1.0

  tier_orb_conf:
    max_tier: 3
    base_reward: 1.0 # a tier is worth base_reward * tier ** growth_factor
    growth_factor: 1.5 # with these two, the three tiers together are worth about 9.0
    chain_break_penalty: -0.5

  neg_orb_conf:
    enabled: false
    reward: -3.0
    cool_down: 10

delay_conf:
  steps: 30

obs_conf:
  observation_handler_conf:
    perception: vector_markovian
