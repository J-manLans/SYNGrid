# SYNGrid scenario config: goal_single_tier_chain_delay
#
# Delay is not locked yet: this file is its full config. Eating a tier orb freezes the other
# tier orbs for delay_conf.steps steps, and they return in the same cells. The negative orb is
# not frozen. The perception must be one that sees the whole grid: vector_markovian.
#
# The thesis delay runs were tier 3 on 5x5, with delays of 30, 70, 130, 260 and 390 and
# max_steps of 150, 200, 300, 550 and 850. The step penalty is 0, so waiting out a silence is
# free, and a broken chain costs as much as the timeout, so breaking it is no way out.
world_conf:
  max_steps: 850

  grid_conf:
    grid_rows: 5
    grid_cols: 5

  droid_conf:
    max_energy: 50 # what the droid starts with and the most it can hold; the episode ends at 0
    step_penalty: 0.0
    boundary_penalty: -1.0

  goal_conf:
    timeout_penalty: -1.0

  tier_orb_conf:
    max_tier: 3
    base_reward: 1.0 # a tier is worth base_reward * tier ** growth_factor
    growth_factor: 1.5 # with these two, the three tiers together are worth about 9.0
    chain_break_penalty: -0.1

  neg_orb_conf:
    enabled: false
    reward: -3.0
    cool_down: 10

delay_conf:
  steps: 390

obs_conf:
  observation_handler_conf:
    perception: vector_markovian
