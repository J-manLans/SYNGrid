# SYNGrid scenario config: goal_single_tier_chain_delay
#
# Delay
#
# The thesis delay runs were tier 3 on 5x5 for delays 30, 70, 130, 260, 390 all with 100 steps.
world_conf:
  max_steps: 100

  grid_conf:
    grid_rows: 5
    grid_cols: 5

  neg_orb_conf:
    enabled: false

obs_conf:
  observation_handler_conf:
    perception: vector_markovian
