# SYNGrid scenario config: goal_single_tier_chain_spatial
#
# Spatial is locked: tier 3, seen through a window around the droid, with its penalties
# and rewards fixed in its base config (scenario/families/goal/single_tier_chain/
# base_configs/spatial.yaml). A run chooses what is below, and any other key is rejected.
# The perception must be one that sees only the window: vector_fog_of_war.
world_conf:
  max_steps: 100

  grid_conf:
    grid_rows: 5
    grid_cols: 5

  neg_orb_conf:
    enabled: false

obs_conf:
  observation_handler_conf:
    perception: vector_fog_of_war
