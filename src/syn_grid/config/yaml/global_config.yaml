# SYNGrid global config: settings that apply to every run.
#
# `scenario` names the scenario to run; its tunables live in the YAML file of
# the same name. `human_control` plays the scenario by hand and overrides
# everything else: the snapshot and the runner config are ignored.
snapshot:
  enabled: false
  id:
scenario: goal_single_tier_chain_spatial
human_control: false