# SYNGrid scenario config, migrated to scenario selection.
#
# scenario: goal_tier_chain_spatial
# The flags that used to imply this scenario are gone. What remains is
# tunable: geometry, the chain length, penalties, reward shape, and the
# perception. The scenario decides what those mean.
world_conf:
  grid_conf:
    grid_rows: 5
    grid_cols: 5

  droid_conf:
    starting_score: 50
    step_penalty: -0.001
    boundary_penalty: -1.0
    reward_multiplier: 1.0
    timeout_penalty: -1.0
    chain_break_penalty: -0.01
    tier_consumption_penalty: -0.001

  orb_conf:
    max_active_orbs: 3
    # negative:
    #   reward:
    #   cool_down:
    #   weight:
    tier:
      max_tier: 3
      base_reward: 3
      growth_factor: 1.5
      linear_reward_growth: true
      scoring: max_tier
      cool_down: 7
      weight: 2

obs_conf:
  observation_handler_conf:
    perception: vector_fog_of_war
    max_steps: 100

  perception_conf:
    max_score: 100