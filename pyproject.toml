###################################################################################
# The -e flag stands for editable mode. It installs the package so changes
# in source code are immediately reflected. Recommended for development.
# [dev] installs extra dependencies for development.
#
# Before running the install command make sure you have a virtual environment (venv)
# so project-specific dependencies are isolated and don’t interfere with your system Python.
#
# pip install -e .[dev]
# Install project + dependencies as defined in pyproject.toml
# and updates the project with new additions if already installed
#
# pip install -e .[dev] --force-reinstall
# Reinstall everything even if versions already match
#
# pip install -e .[dev] --force-reinstall --no-cache-dir
# Full clean reinstall, ignores pip cache (good when pip is acting weird)
#
# pip install -e .[dev] --upgrade
# Upgrade dependencies if newer versions are allowed by version constraints
#
# pip show syn-grid
# Show where the package is installed and which version pip sees
#
# pip check
# Verify dependency conflicts
###################################################################################

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syn-grid"
version = "0.4.0"
license = {file = "LICENSE"}
description = "A configurable benchmark framework for temporal credit assignment in reinforcement learning"
readme = "README.md"
authors = [
    {name = "Joel Lansgren", email = "jola2311@student.miun.se"},
    {name = "Lauri Bernstéen", email = "labe2301@student.miun.se"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.2",
    "stable-baselines3>=2.7.1",
    "sb3-contrib>=2.7.1",
    "tensorboard>=2.20.0",
    "numpy>=2.2",
    "pygame>=2.6",
    "PyYAML>=6.0",
    "pydantic>=2.12",
    "moviepy>=2.2"
]

[project.optional-dependencies]
# Used for users who wants the extra functionalities but don't need the [dev] setup.
extra = [
    "matplotlib>=3.10",
    "pandas>=2.3"
]

dev = [
    "pytest>=9.0.2",
    "coverage>=7.17.2", # Which lines and branches the tests run. `coverage run -m pytest` to run, and `coverage report -m` to see results
    "mutmut>=3.8.1", # Mutation testing: whether a test goes red when the code it guards is broken. `mutmut run` to run and `mutmut browse` to see results
    "hypothesis>=6.170.15", # Property-based tests: a rule checked over many generated inputs, shrunk to the smallest that fails
    "ruff>=0.16" # For linting and removing unused imports. Formatting: ruff format path/to/file.py or ruff format path/to/package, removing unused imports: ruff check --select F401 --fix src/syn_grid
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
# ensure non-Python files like assets are included
include-package-data = true

[tool.setuptools.package-data]
"syn_grid" = ["assets/**/*", "**/*.yaml"]

[tool.ruff]
# The legacy strain is a frozen copy and is never edited, formatting included.
extend-exclude = ["src/syn_grid/legacy"]
# Also when a file is named directly, as an editor does on save.
force-exclude = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["syn_grid"]
# The legacy strain is a frozen copy, and no test reaches it. The __init__.py files hold no code to measure.
omit = ["*/syn_grid/legacy/*", "*/__init__.py"]
# The regression test runs the replay probe as a subprocess, and its lines count too.
patch = ["subprocess"]

[tool.pyright]
# The legacy strain is a frozen copy and is never edited. Setting exclude replaces pyright's defaults, so they are
# listed again.
exclude = ["src/syn_grid/legacy", "**/node_modules", "**/__pycache__", "**/.*"]
# A method that replaces a parent's must say so with @override; see docs/code_style.md.
reportImplicitOverride = "warning"

[tool.mutmut]
source_paths = ["src/syn_grid"]
also_copy = ["scripts"]
# The legacy strain is a frozen copy, and no test reaches it. The __init__.py files hold no code to mutate.
do_not_mutate = ["*/legacy/*", "*/__init__.py"]
# only_mutate = ["*/single_tier_chain/watcher.py"] # the trial: one file
